{% extends "partials/base-settings.html" %}
{% block content %}
<div class="form-box">
    <h1 id="title">Update profile</h1>
    <form class="createprofile-frm" action="{% url 'settings:profile_update' profile_id=profile.id %}" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="input-group">
            <div class="input-field" id="nameField">
                {{ form.name }}
            </div>
            <div class="input-field" id="nameField">
                {{ form.school }}
            </div>
            <div class="input-field" id="nameField">
                {{ form.profile_picture }}
            </div>
            <div class="input-field">
                <p>Grade level</p>
                {{ form.grade_level }}
            </div>
        </div>
        <div class="btn-field">
            <button type="submit">Update Profile</button>
        </div>
    </form>
</div>
{% endblock %}

<!----- use them later well MUST CHECK ON THESE -->
<a href="{% url 'profile_update' profile.id %}">Edit Profile</a>
<a href="{% url 'profile_delete' profile.id %}">Delete Profile</a>
