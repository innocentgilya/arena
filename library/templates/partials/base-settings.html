{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="{% static 'assets/settings-styles.css' %}">
    <link rel="stylesheet", href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/5778f952c5.js" crossorigin="anonymous"></script> 
</head>
<body>
    <!------Sidebar------------------------------------->
    <div class="side-contaider">
        <h1>StudyArena</h1>
        <a href="{% url 'library:profile-home' profile_id=profile.id %}"><i class="fa-solid fa-book"></i> Books</a>
        <a href="{% url 'library:Ppapers-home' profile_id=profile.id %}"><i class="fa-solid fa-copy"></i></i>Pastpapers</a>
        <a href="{% url 'library:myshelf' user_id=user.id profile_id=profile.id %}"><i class="fa-solid fa-address-book"></i>myshelf</a>
        <a href="{% url 'settings:account_display' user_id=user.id profile_id=profile.id %}"><i class="fa-solid fa-gear"></i></i>Settings</a>
    </div>
    <!------EndSidebar------------------------------------->

    <div class="main-container">
        <nav>
            <h2>Settings</h2>
            <div class="right-nav">
                <a href=""><i class="fa-regular fa-bell"></i></a>
                <a href="javascript:void(0)" class="user-icon" onclick="toggleMenu()"><img src="{{ profile.profile_picture.url }}" alt="Profile 1"></i></i></a>
                <a href=""><i class="fa-solid fa-chevron-down"></i></a>
                <div class="sub-menu-wrp" id="sub-menu">
                    <div class="sub-menu">
                        <div class="user-info">
                            <img src="" alt="">
                            <h3>{{ profile.name }}</h3>
                        </div>
                        <hr>
                        <a href="{% url 'settings:account_display' user_id=user.id profile_id=profile.id %}" class="sub-menu-link">
                            <i class="fa-solid fa-gear"></i>
                            <p>Settings</p>
                            <span>></span>
                        </a>                              
                        <a href="{% url 'userauths:profile_list' %}" class="sub-menu-link">
                            <i class="fa-solid fa-users"></i>
                            <p>Profiles</p>
                            <span>></span>
                        </a>
                        <a href="{% url 'userauths:sign-out' %}" class="sub-menu-link">
                            <i class="fa-solid fa-right-from-bracket"></i>
                            <p>Logout</p>
                            <span>></span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>
        <div class="nav-2">
            <a id="profile-id" href="{% url 'settings:account_display' user_id=user.id profile_id=profile.id %}">Profile</a>

            <a id="account-id"href="{% url 'settings:account_settings_display' user_id=user.id %}">Account</a>
        </div>

{% block content %}

{% endblock content %}
</body>
<script>
    let subMenu = document.getElementById("sub-menu");

    function toggleMenu(){
        subMenu.classList.toggle("open-menu");
    }
</script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</html>
